# Cloudflare Worker: Tikdum outside watcher (see worker.js and README.md).
name = "tikdum-outside-watcher"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[triggers]
crons = ["* * * * *"]

# Created with: npx wrangler kv namespace create STATE  (then paste its id here)
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_ID"

[vars]
MSG91_NOTICE_TEMPLATE = "tikdum_message"
MSG91_NOTICE_TEMPLATE_VARS = "name,message"
# MSG91_WHATSAPP_NUMBER and OWNER_PHONES are set in the Cloudflare dashboard
# (Worker -> Settings -> Variables and Secrets), MSG91_AUTH_KEY as a secret.
