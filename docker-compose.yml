services:
  server:
    build: ./server
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PHONES: ${ADMIN_PHONES}
      WHATSAPP_INSTANCE_ID: ${WHATSAPP_INSTANCE_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-service-account.json
    volumes:
      - /root/tikdum-secrets/gcp-service-account.json:/run/secrets/gcp-service-account.json:ro

  local-service-app:
    build:
      context: ./local-service-app
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL}
    restart: unless-stopped
    ports:
      - "5175:80"
    depends_on:
      - server

  provider-app:
    build:
      context: ./provider-app
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL}
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - server

  admin-dashboard:
    build:
      context: ./admin-dashboard
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL}
    restart: unless-stopped
    ports:
      - "5177:80"
    depends_on:
      - server
