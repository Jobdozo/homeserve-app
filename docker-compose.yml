services:
  server:
    build:
      context: ./server
      # Build containers on this VPS time out reaching registry.npmjs.org on Docker's
      # default network; the host's own network works.
      network: host
    restart: unless-stopped
    # Containers on Docker's default network can't reach Cloudflare-hosted services on this VPS
    # (npm at build time, api.msg91.com at run time: ETIMEDOUT, so login codes never send).
    # The host's own network works, so the API runs on it and listens on port 4000 directly.
    network_mode: host
    environment:
      PORT: "4000"
      NODE_OPTIONS: --dns-result-order=ipv4first
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PHONES: ${ADMIN_PHONES}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY}
      MSG91_WHATSAPP_NUMBER: ${MSG91_WHATSAPP_NUMBER}
      MSG91_OTP_TEMPLATE: ${MSG91_OTP_TEMPLATE:-otp}
      MSG91_OTP_TEMPLATE_LANG: ${MSG91_OTP_TEMPLATE_LANG:-en}
      # Image Studio (Super Admin -> Services & Categories -> Image Studio). Models are picked automatically unless set.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-}
      # Second picture maker: Cloudflare Workers AI (set with deploy/set-cloudflare-ai.sh). IMAGE_PROVIDER: auto|gemini|cloudflare.
      CF_AI_ACCOUNT_ID: ${CF_AI_ACCOUNT_ID:-}
      CF_AI_TOKEN: ${CF_AI_TOKEN:-}
      CF_AI_IMAGE_MODEL: ${CF_AI_IMAGE_MODEL:-}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-auto}
      # Google Maps browser key for the location picker (website-restricted to tikdum.com; set with deploy/set-maps-key.sh).
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      # GST portal check of providers' GST numbers through API Setu (server/src/gstPortal.js; set with deploy/set-apisetu-gst.sh).
      APISETU_CLIENT_ID: ${APISETU_CLIENT_ID:-}
      APISETU_API_KEY: ${APISETU_API_KEY:-}
      APISETU_GST_URL: ${APISETU_GST_URL:-}
      # Facebook Page + Instagram posting (server/src/social.js; set with deploy/set-meta.sh).
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_PAGE_TOKEN: ${META_PAGE_TOKEN:-}
      META_IG_USER_ID: ${META_IG_USER_ID:-}
      # Threads (deploy/set-threads.sh); the server renews the token itself.
      THREADS_USER_ID: ${THREADS_USER_ID:-}
      THREADS_TOKEN: ${THREADS_TOKEN:-}
      # YouTube Shorts (deploy/set-youtube.sh). YOUTUBE_PRIVACY: public | unlisted | private.
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN:-}
      YOUTUBE_PRIVACY: ${YOUTUBE_PRIVACY:-public}
      SOCIAL_IMAGE_BASE: ${SOCIAL_IMAGE_BASE:-https://api.tikdum.com}
      # Tell Bing and the other IndexNow engines about tikdum.com pages (server/src/indexNow.js). "off" stops it.
      INDEXNOW: ${INDEXNOW:-on}
      # Meta Pixel + Conversions API: bookings for Meta ads (server/src/metaEvents.js; set with deploy/set-meta-pixel.sh).
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_CAPI_TOKEN: ${META_CAPI_TOKEN:-}
      META_TEST_EVENT_CODE: ${META_TEST_EVENT_CODE:-}
      MSG91_OTP_HAS_BUTTON: ${MSG91_OTP_HAS_BUTTON:-}
      # Approved WhatsApp template for Admin messages outside the 24-hour window (tikdum_message: "Hello {{1}}, …{{2}}…").
      # VARS = its body variables in order: message, or name,message.
      MSG91_NOTICE_TEMPLATE: ${MSG91_NOTICE_TEMPLATE:-tikdum_message}
      MSG91_NOTICE_TEMPLATE_LANG: ${MSG91_NOTICE_TEMPLATE_LANG:-en}
      MSG91_NOTICE_TEMPLATE_VARS: ${MSG91_NOTICE_TEMPLATE_VARS:-name,message}
      # Shared secret MSG91 sends as the x-webhook-secret header on inbound WhatsApp.
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET}
      # Email inbox (mailbox.js): Postmark sends; its inbound webhook uses EMAIL_WEBHOOK_SECRET as the Basic auth password.
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      EMAIL_FROM: ${EMAIL_FROM:-support@tikdum.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Tikdum Support}
      EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-}
      # Pinterest (socialPinterest.js): the app's ID and secret (deploy/set-pinterest.sh); the sign-in
      # itself is done in Admin → Social Media. PINTEREST_API=https://api-sandbox.pinterest.com/v5 while
      # the app only has Trial access.
      PINTEREST_CLIENT_ID: ${PINTEREST_CLIENT_ID:-}
      PINTEREST_CLIENT_SECRET: ${PINTEREST_CLIENT_SECRET:-}
      PINTEREST_API: ${PINTEREST_API:-}
      PINTEREST_BOARD_ID: ${PINTEREST_BOARD_ID:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-service-account.json
      DATA_DIR: /app/data
      # Cloud storage for uploads (scaling step 3, see deploy/STORAGE.md). Off until all seven are set in .env.
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      STORAGE_PUBLIC_BUCKET: ${STORAGE_PUBLIC_BUCKET:-}
      STORAGE_PRIVATE_BUCKET: ${STORAGE_PRIVATE_BUCKET:-}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
    volumes:
      - /root/tikdum-secrets/gcp-service-account.json:/run/secrets/gcp-service-account.json:ro
      - /root/tikdum-data:/app/data

  local-service-app:
    build:
      context: ./local-service-app
      network: host
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL}
    restart: unless-stopped
    ports:
      - "5175:80"
    extra_hosts:
      - "server:host-gateway"
    depends_on:
      - server

  provider-app:
    build:
      context: ./provider-app
      network: host
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL}
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - server

  admin-dashboard:
    build:
      context: ./admin-dashboard
      network: host
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL}
    restart: unless-stopped
    ports:
      - "5177:80"
    depends_on:
      - server

  # AI agents worker (Operations + Reporting). Talks to the API above over
  # HTTP only, using per-agent keys created in Admin -> AI Agents.
  agents:
    build:
      context: ./agents
      network: host
    restart: unless-stopped
    network_mode: host
    environment:
      TIKDUM_API_URL: http://127.0.0.1:4000/api
      AGENT_KEY_OPERATIONS: ${AGENT_KEY_OPERATIONS}
      AGENT_KEY_REPORTING: ${AGENT_KEY_REPORTING}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      REPORT_HOUR_IST: ${REPORT_HOUR_IST:-9}
      AGENT_KEY_COMPLAINTS: ${AGENT_KEY_COMPLAINTS}
      AGENT_KEY_SUPPORT: ${AGENT_KEY_SUPPORT}
      AGENT_KEY_REGISTRATION: ${AGENT_KEY_REGISTRATION}
      AGENT_KEY_VERIFICATION: ${AGENT_KEY_VERIFICATION}
      # Verification Agent WhatsApp: "Free registration till <this>!" (empty = "Registration is free!")
      VERIFICATION_WA_FREE_UNTIL: ${VERIFICATION_WA_FREE_UNTIL:-}
      AGENT_KEY_PAYMENTS: ${AGENT_KEY_PAYMENTS}
      AGENT_KEY_DISPATCH: ${AGENT_KEY_DISPATCH}
      AGENT_KEY_QUALITY: ${AGENT_KEY_QUALITY}
      AGENT_KEY_RETENTION: ${AGENT_KEY_RETENTION}
      AGENT_KEY_FRAUD: ${AGENT_KEY_FRAUD}
      AGENT_KEY_RENEWALS: ${AGENT_KEY_RENEWALS:-}
      AGENT_KEY_REVIEWS: ${AGENT_KEY_REVIEWS}
      AGENT_KEY_CEO: ${AGENT_KEY_CEO}
      AGENT_KEYS_SPECIALISTS: ${AGENT_KEYS_SPECIALISTS}
      # Engineering team (GitHub): App id + private key file (see agents/README.md)
      AGENT_KEYS_ENGINEERING: ${AGENT_KEYS_ENGINEERING}
      GITHUB_REPO: ${GITHUB_REPO:-Jobdozo/homeserve-app}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY_FILE: /app/secrets/github-app.pem
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ENGINEERING_MODEL: ${ENGINEERING_MODEL:-claude-sonnet-5-5}
      AGENT_STATE_DIR: /app/state
    volumes:
      - /root/tikdum-data/agents-state:/app/state
      - /root/tikdum-data/agents-secrets:/app/secrets:ro
    depends_on:
      - server

  # Network Bot (agents/src/netwatch.js, no AI): every second checks the API, the three
  # website containers and nginx; every 10 s the public HTTPS addresses and the internet.
  # Anything down for 20 s -> WhatsApp to ADMIN_PHONES straight through MSG91, so it gets
  # out even while the API is down. Same image as agents (built by build-images.sh agents);
  # no depends_on, so it keeps watching when the API won't start.
  netwatch:
    image: homeserve-agents
    command: ["node", "src/netwatch.js"]
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_OPTIONS: --dns-result-order=ipv4first
      TIKDUM_API_URL: http://127.0.0.1:4000/api
      AGENT_STATE_DIR: /app/state
      # Optional: shows the bot in Admin -> AI Agents (heartbeat + alerts in the feed).
      AGENT_KEY_NETWORK: ${AGENT_KEY_NETWORK:-}
      ADMIN_PHONES: ${ADMIN_PHONES}
      # Other numbers for these alerts instead of ADMIN_PHONES (comma-separated), if wanted.
      NETWATCH_PHONES: ${NETWATCH_PHONES:-}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY}
      MSG91_WHATSAPP_NUMBER: ${MSG91_WHATSAPP_NUMBER}
      MSG91_NOTICE_TEMPLATE: ${MSG91_NOTICE_TEMPLATE:-tikdum_message}
      MSG91_NOTICE_TEMPLATE_LANG: ${MSG91_NOTICE_TEMPLATE_LANG:-en}
      MSG91_NOTICE_TEMPLATE_VARS: ${MSG91_NOTICE_TEMPLATE_VARS:-name,message}
      NETWATCH_DOWN_AFTER_SEC: ${NETWATCH_DOWN_AFTER_SEC:-20}
      NETWATCH_REMIND_MIN: ${NETWATCH_REMIND_MIN:-10}
    volumes:
      - /root/tikdum-data/agents-state:/app/state
