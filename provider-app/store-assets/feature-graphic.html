<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Poppins';
    src: local('Poppins');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .stage {
    width: 1024px; height: 500px;
    transform-origin: top left;
  }
  .banner {
    width: 1024px; height: 500px;
    position: relative;
    background: linear-gradient(135deg, #16a34a 0%, #15803d 55%, #0f5c2e 100%);
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    width: 700px; height: 700px;
    right: -180px; top: -150px;
    background: radial-gradient(circle, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0) 65%);
  }
  .content {
    position: relative;
    z-index: 2;
    padding-left: 72px;
    max-width: 620px;
  }
  .icon {
    width: 84px; height: 84px;
    border-radius: 22px;
    background: linear-gradient(135deg, #22c55e, #15803d);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 24px rgba(0,0,0,0.25);
    margin-bottom: 28px;
  }
  .icon svg { width: 44px; height: 44px; }
  h1 {
    color: #ffffff;
    font-size: 56px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -1px;
  }
  h1 span { color: #baf7cf; }
  p.tag {
    color: rgba(255,255,255,0.88);
    font-size: 24px;
    font-weight: 500;
    margin-top: 18px;
    line-height: 1.4;
  }
  .phone {
    position: absolute;
    right: 90px; top: 50%;
    transform: translateY(-50%);
    width: 260px; height: 460px;
    background: #0b1420;
    border-radius: 34px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4);
    padding: 10px;
    z-index: 2;
  }
  .screen {
    width: 100%; height: 100%;
    background: #ffffff;
    border-radius: 26px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 46px;
  }
  .bell {
    width: 74px; height: 74px;
    border-radius: 50%;
    background: #16a34a;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
  }
  .bell svg { width: 38px; height: 38px; }
  .badge {
    color: #16a34a;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .job {
    color: #0f172a;
    font-size: 19px;
    font-weight: 800;
    margin-bottom: 4px;
  }
  .price {
    color: #16a34a;
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 18px;
  }
  .btnrow { display: flex; gap: 10px; width: 84%; }
  .btn {
    flex: 1;
    padding: 10px 0;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
  }
  .decline { border: 2px solid #fecaca; color: #dc2626; }
  .accept { background: #16a34a; color: #fff; }
  .pulse {
    position: absolute;
    width: 74px; height: 74px;
    border-radius: 50%;
    border: 3px solid rgba(22,163,74,0.5);
    top: 46px;
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
  <div class="banner">
    <div class="glow"></div>
    <div class="content">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1>Never miss a <span>job</span> again</h1>
      <p class="tag">Booking requests ring like a call — even when the app is closed.</p>
    </div>
    <div class="phone">
      <div class="screen">
        <div class="pulse"></div>
        <div class="bell">
          <svg viewBox="0 0 24 24" fill="none"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.73 21a2 2 0 01-3.46 0" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="badge">NEW BOOKING REQUEST</div>
        <div class="job">Ac repairing</div>
        <div class="price">₹499</div>
        <div class="btnrow">
          <div class="btn decline">Decline</div>
          <div class="btn accept">Accept</div>
        </div>
      </div>
    </div>
  </div>
  </div>
  <script>
    function fit() {
      var s = Math.min(window.innerWidth / 1024, window.innerHeight / 500);
      document.getElementById('stage').style.transform = 'scale(' + s + ')';
    }
    fit();
    window.addEventListener('resize', fit);
  </script>
</body>
</html>
