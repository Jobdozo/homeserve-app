server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The sitemap needs live category/service data, so it's generated by the
    # API (see server/src/index.js's /sitemap.xml route) rather than being a
    # static file here — proxied over the Docker Compose network by service
    # name, same as this container's own API calls resolve at runtime.
    location = /sitemap.xml {
        proxy_pass http://server:4000/sitemap.xml;
    }

    # Built files have a content hash in their name, so they never change: cache them for a year. A file from an
    # older version that no longer exists is a real 404 — never the app page — so an open tab notices the update
    # and reloads instead of trying to run a web page as code.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The app page and the service worker must always be fetched fresh, so a reload picks up a new version.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
