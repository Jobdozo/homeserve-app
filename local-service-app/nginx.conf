# One address for search engines: www.tikdum.com sends everyone (and Google) to tikdum.com,
# the address the sitemap and canonical tags use. The host's nginx passes the Host header through.
server {
    listen 80;
    server_name www.tikdum.com;
    return 301 https://tikdum.com$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The sitemap needs live category/service data, so it's generated by the
    # API (see server/src/index.js's /sitemap.xml route) rather than being a
    # static file here — proxied over the Docker Compose network by service
    # name, same as this container's own API calls resolve at runtime.
    location = /sitemap.xml {
        proxy_pass http://server:4000/sitemap.xml;
    }

    # Built files have a content hash in their name, so they never change: cache them for a year. A file from an
    # older version that no longer exists is a real 404 — never the app page — so an open tab notices the update
    # and reloads instead of trying to run a web page as code.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The app page and the service worker must always be fetched fresh, so a reload picks up a new version.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # The plain app page, for the API's page builder (seoPages.js) to fill in.
    location = /__shell {
        default_type text/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    # Files are served as they are; every other address is a page of the app. Pages go out with
    # their own title, description, preview tags, structured data and status (404 when the page
    # doesn't exist), built by the API (seoPages.js) from this same index.html. If the API is
    # down or slow, the plain index.html goes out instead — the site never depends on it.
    location / {
        try_files $uri @page;
        add_header Cache-Control "no-cache";
    }
    location @page {
        rewrite ^ /__page break;
        proxy_pass http://server:4000;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @plain;
    }
    location @plain {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
}
