<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      This static baseline matters beyond the first paint: react-helmet-async
      (see src/components/Seo.jsx) only rewrites these tags after the JS
      bundle runs, so link-preview bots (WhatsApp, etc.) and any crawler that
      doesn't execute JS only ever see what's written here.
    -->
    <title>Tikdum — Book Trusted Home Services Near You</title>
    <meta
      name="description"
      content="Book trusted home services near you on Tikdum — cleaning, pest control, AC repair, and more. Compare verified local providers and book instantly over WhatsApp."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tikdum" />
    <meta property="og:title" content="Tikdum — Book Trusted Home Services Near You" />
    <meta
      property="og:description"
      content="Book trusted home services near you on Tikdum — cleaning, pest control, AC repair, and more. Compare verified local providers and book instantly over WhatsApp."
    />
    <meta property="og:url" content="https://tikdum.com/" />
    <meta property="og:image" content="https://tikdum.com/pwa-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-title" content="Tikdum" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#5B3FE0" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /*
        On a slow connection the JS bundle can take well over a minute to
        download — without this, the screen stays blank white the whole
        time and looks broken rather than loading. This is plain CSS/HTML
        rendered before any script runs; React overwrites #root's contents
        the moment it mounts, so nothing needs to remove this manually.
      */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f8fb;
      }
      #initial-loader .mark {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: #5b3fe0;
        animation: initial-loader-pulse 1.4s ease-in-out infinite;
      }
      @keyframes initial-loader-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(0.92); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader"><div class="mark"></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
